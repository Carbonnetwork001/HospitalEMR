<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient chart — Records</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
    :root{
      --bg:#F6F5F1; --paper:#FDFCFA; --ink:#1C2321; --accent:#2F5D50;
      --accent-light:#EEF3F1; --accent-border:#C9D6D0;
      --border:#DAD6CC; --row-border:#E7E4DB; --muted:#6B6455; --faint:#9C9686;
      --alert-bg:#FBF0EE; --alert-border:#EBD2CC; --alert:#A23B2E;
      --warn-bg:#F7ECD9; --warn:#8A6414; --tab-idle:#EDEBE3;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);}
    a{color:inherit;}
    .serif{font-family:'Source Serif 4',serif;}
    .mono{font-family:'IBM Plex Mono',monospace;}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--paper);}
    .brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;text-decoration:none;color:var(--ink);}
    .brand svg{flex-shrink:0;}
    .input{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:9px 12px;font-size:13.5px;color:var(--ink);outline:none;width:100%;}
    .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,93,80,0.12);}
    .input::placeholder{color:var(--faint);}
    label.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
    .btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;text-decoration:none;}
    .btn-primary{background:var(--accent);color:var(--paper);}
    .btn-primary:disabled{background:#B9C4BF;cursor:not-allowed;}
    .btn-secondary{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border);}
    .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border);}
    .search-box{position:relative;}
    .search-box svg{position:absolute;left:10px;top:11px;}
    .search-box input{padding-left:32px;width:260px;}
    .row{border-bottom:1px solid var(--row-border);}
    .row:last-child{border-bottom:none;}
    .patient-link{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--ink);}
    .patient-link:hover{background:var(--accent-light);}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;}
    .badge-severe{background:#F5E4E1;color:var(--alert);}
    .badge-moderate{background:var(--warn-bg);color:var(--warn);}
    .badge-mild{background:var(--tab-idle);color:var(--muted);}
    .badge-active{background:var(--accent-light);color:var(--accent);}
    .badge-inactive{background:var(--tab-idle);color:#8A8574;}
    .empty{padding:32px 0;text-align:center;font-size:13.5px;color:var(--faint);}
    .banner{margin:16px 0 20px;border-radius:6px;padding:10px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13px;}
    .banner-alert{background:var(--alert-bg);border:1px solid var(--alert-border);}
    .banner-ok{background:var(--accent-light);border:1px solid var(--accent-border);}
    .tabs{display:flex;margin-bottom:-1px;flex-wrap:wrap;}
    .tab{position:relative;padding:8px 16px 9px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;background:var(--tab-idle);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;margin-right:2px;}
    .tab:hover{background:#F1EFE8;color:var(--ink);}
    .tab.active{background:var(--paper);color:var(--accent);font-weight:600;z-index:1;}
    .tab-panel{border:1px solid var(--border);background:var(--paper);padding:20px;min-height:280px;border-radius:0 6px 6px 6px;}
    table{width:100%;border-collapse:collapse;}
    th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:400;padding-bottom:8px;}
    td{padding:9px 0;font-size:13px;}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px;}
    .stat-card{border:1px solid var(--row-border);border-radius:6px;padding:12px 14px;}
    .stat-value{font-size:22px;font-weight:700;}
    .stat-label{font-size:12px;color:var(--muted);margin-top:2px;}
    .icon-btn{background:none;border:none;cursor:pointer;padding:2px;display:inline-flex;}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .section-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;}
    .inline-form{padding:16px;margin-bottom:16px;border-radius:6px;background:#FBFAF7;border:1px solid var(--border);}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
    .form-actions{display:flex;gap:8px;margin-top:14px;}
    .center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:32px;width:380px;max-width:90vw;}
    .save-note{padding:8px 24px;font-size:12px;background:var(--alert-bg);color:var(--alert);border-top:1px solid var(--alert-border);}
    ::-webkit-scrollbar{width:8px;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
    @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
    .chart-wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:16px;}
    .patient-header h1{margin:0;font-size:26px;font-weight:700;line-height:1.15;}
    .meta-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:6px;}
    .visit-item, .med-item, .allergy-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
    .visit-title{font-size:14px;font-weight:600;}
    .visit-meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
    .visit-notes{font-size:13.5px;color:#3F3A32;}
    .problem-item{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 0;}
    .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0;}
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="patient-list.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      Records
    </a>
    <a class="btn btn-ghost" href="login.html" style="font-size:12.5px;">Sign out</a>
  </div>

  <div class="chart-wrap">
    <a class="back-link" href="patient-list.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      All patients
    </a>
    <div id="content"><div class="empty">Loading chart…</div></div>
  </div>
  <div id="saveNote"></div>

  <script>
    const STORAGE_KEY = 'emr-patients-v1';

    function seedPatients(){
      return [
        { id:"p1", name:"Anna Kovač", dob:"1988-04-12", sex:"Female", mrn:"00482", phone:"(555) 019-2231", bloodType:"O+",
          allergies:[{id:"a1",substance:"Penicillin",severity:"Severe",reaction:"Anaphylaxis"}],
          problems:["Type 2 diabetes","Hypertension"],
          medications:[
            {id:"m1",name:"Metformin",dosage:"500mg",frequency:"Twice daily",started:"2023-02-10",status:"Active"},
            {id:"m2",name:"Lisinopril",dosage:"10mg",frequency:"Once daily",started:"2023-06-01",status:"Active"}],
          visits:[
            {id:"v1",date:"2026-08-14",type:"Follow-up",provider:"Dr. Osei",reason:"Diabetes management review",notes:"A1c improved to 6.9%. Continue current regimen, recheck in 3 months."},
            {id:"v2",date:"2026-03-02",type:"Annual physical",provider:"Dr. Osei",reason:"Routine exam",notes:"No new concerns. Updated vaccination record."}],
          labs:[
            {id:"l1",date:"2026-08-14",test:"Hemoglobin A1c",result:"6.9",unit:"%",refRange:"4.0–5.6",flag:"High"},
            {id:"l2",date:"2026-08-14",test:"LDL Cholesterol",result:"98",unit:"mg/dL",refRange:"<100",flag:"Normal"}],
          vitals:[{id:"vi1",date:"2026-08-14",bp:"128/82",hr:"76",temp:"98.4",rr:"16",spo2:"98",weight:"165",height:"65"}]
        },
        { id:"p2", name:"Marcus Webb", dob:"1975-11-30", sex:"Male", mrn:"00317", phone:"(555) 442-8810", bloodType:"A-",
          allergies:[], problems:["Seasonal allergic rhinitis"],
          medications:[{id:"m3",name:"Cetirizine",dosage:"10mg",frequency:"Once daily, as needed",started:"2025-04-01",status:"Active"}],
          visits:[{id:"v3",date:"2026-05-20",type:"Sick visit",provider:"Dr. Álvarez",reason:"Nasal congestion, sneezing",notes:"Consistent with seasonal allergies. Advised OTC antihistamine."}],
          labs:[],
          vitals:[{id:"vi2",date:"2026-05-20",bp:"118/76",hr:"68",temp:"98.1",rr:"14",spo2:"99",weight:"184",height:"70"}]
        },
        { id:"p3", name:"Priya Ramanathan", dob:"2001-02-18", sex:"Female", mrn:"00559", phone:"(555) 671-0094", bloodType:"B+",
          allergies:[{id:"a2",substance:"Shellfish",severity:"Moderate",reaction:"Hives, swelling"},{id:"a3",substance:"Latex",severity:"Mild",reaction:"Contact rash"}],
          problems:[], medications:[],
          visits:[{id:"v4",date:"2026-07-01",type:"New patient",provider:"Dr. Osei",reason:"Establishing care",notes:"Healthy young adult. No active concerns. Discussed allergy history at length."}],
          labs:[{id:"l3",date:"2026-07-01",test:"Complete Blood Count",result:"Normal",unit:"—",refRange:"—",flag:"Normal"}],
          vitals:[{id:"vi3",date:"2026-07-01",bp:"110/70",hr:"64",temp:"98.6",rr:"15",spo2:"99",weight:"128",height:"64"}]
        },
        { id:"p4", name:"Harold Finch", dob:"1952-09-05", sex:"Male", mrn:"00201", phone:"(555) 903-4471", bloodType:"AB+",
          allergies:[{id:"a4",substance:"Sulfa drugs",severity:"Severe",reaction:"Stevens-Johnson syndrome"}],
          problems:["Coronary artery disease","Osteoarthritis","Chronic kidney disease, stage 2"],
          medications:[
            {id:"m4",name:"Atorvastatin",dosage:"40mg",frequency:"Once daily, evening",started:"2019-01-15",status:"Active"},
            {id:"m5",name:"Aspirin",dosage:"81mg",frequency:"Once daily",started:"2019-01-15",status:"Active"},
            {id:"m6",name:"Amlodipine",dosage:"5mg",frequency:"Once daily",started:"2021-11-02",status:"Active"}],
          visits:[
            {id:"v5",date:"2026-09-01",type:"Follow-up",provider:"Dr. Álvarez",reason:"Cardiology check-in",notes:"Stable. ECG unremarkable. Continue current medications."},
            {id:"v6",date:"2026-04-18",type:"Follow-up",provider:"Dr. Álvarez",reason:"Kidney function monitoring",notes:"eGFR stable at 68. No dose adjustments needed."}],
          labs:[
            {id:"l4",date:"2026-09-01",test:"Creatinine",result:"1.2",unit:"mg/dL",refRange:"0.7–1.3",flag:"Normal"},
            {id:"l5",date:"2026-09-01",test:"LDL Cholesterol",result:"142",unit:"mg/dL",refRange:"<100",flag:"High"}],
          vitals:[{id:"vi4",date:"2026-09-01",bp:"134/88",hr:"72",temp:"98.2",rr:"16",spo2:"97",weight:"179",height:"69"}]
        }
      ];
    }

    async function loadPatients(){
      try{
        const result = await window.storage.get(STORAGE_KEY, false);
        const parsed = result ? JSON.parse(result.value) : null;
        if(parsed && Array.isArray(parsed) && parsed.length) return parsed;
      }catch(e){}
      const seed = seedPatients();
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(seed), false); }catch(e){}
      return seed;
    }

    async function savePatients(patients){
      try{ const r = await window.storage.set(STORAGE_KEY, JSON.stringify(patients), false); return !!r; }
      catch(e){ return false; }
    }

    function ageOf(dob){
      const b=new Date(dob), t=new Date();
      let a=t.getFullYear()-b.getFullYear();
      const m=t.getMonth()-b.getMonth();
      if(m<0||(m===0&&t.getDate()<b.getDate())) a--;
      return a;
    }
    function formatDate(d){
      return new Date(d+"T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
    }
    function initialsOf(name){
      return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
    }
    function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }
    function esc(str){
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function qs(name){
      return new URLSearchParams(window.location.search).get(name);
    }

    const TABS = [
      {key:'overview', label:'Overview'},
      {key:'visits', label:'Visits'},
      {key:'medications', label:'Medications'},
      {key:'allergies', label:'Allergies'},
      {key:'labs', label:'Labs'},
      {key:'vitals', label:'Vitals'}
    ];

    let patients = [];
    let patientId = null;
    let activeTab = 'overview';
    let addingType = null;

    function currentPatient(){ return patients.find(p => p.id === patientId); }

    async function persist(){
      const ok = await savePatients(patients);
      document.getElementById('saveNote').innerHTML = ok ? '' :
        '<div class="save-note">Changes couldn\'t be saved. They\'ll be lost if you leave this page.</div>';
    }

    function fieldHtml(f){
      const id = 'nf_' + f.key;
      if(f.type === 'select'){
        return `<div><label class="field-label">${esc(f.label)}</label>
          <select class="input" id="${id}">${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;
      }
      if(f.type === 'textarea'){
        return `<div><label class="field-label">${esc(f.label)}</label>
          <textarea class="input" id="${id}" rows="2"></textarea></div>`;
      }
      return `<div><label class="field-label">${esc(f.label)}</label>
        <input class="input" id="${id}" type="${f.type||'text'}" placeholder="${esc(f.placeholder||'')}" value="${esc(f.default||'')}"></div>`;
    }

    function inlineFormHtml(fields, submitLabel, onSubmitFn){
      return `
        <div class="inline-form">
          <div class="form-grid">${fields.map(fieldHtml).join('')}</div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="${onSubmitFn}()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/></svg>
              ${esc(submitLabel)}
            </button>
            <button class="btn btn-ghost" onclick="cancelAdd()">Cancel</button>
          </div>
        </div>`;
    }

    function toggleAdd(type){
      addingType = (addingType === type) ? null : type;
      renderPanel();
    }
    function cancelAdd(){ addingType = null; renderPanel(); }

    function val(id){ return document.getElementById(id).value; }

    async function submitVisit(){
      const p = currentPatient();
      p.visits.unshift({ id:uid('v'), date:val('nf_date'), type:val('nf_type'), provider:val('nf_provider'), reason:val('nf_reason'), notes:val('nf_notes') });
      addingType = null; await persist(); renderPanel();
    }
    async function submitMed(){
      const p = currentPatient();
      p.medications.unshift({ id:uid('m'), name:val('nf_name'), dosage:val('nf_dosage'), frequency:val('nf_frequency'), started:val('nf_started'), status:val('nf_status') });
      addingType = null; await persist(); renderPanel();
    }
    async function submitAllergy(){
      const p = currentPatient();
      p.allergies.unshift({ id:uid('a'), substance:val('nf_substance'), severity:val('nf_severity'), reaction:val('nf_reaction') });
      addingType = null; await persist(); renderPatientHeaderAndPanel();
    }
    async function submitLab(){
      const p = currentPatient();
      p.labs.unshift({ id:uid('l'), date:val('nf_date'), test:val('nf_test'), result:val('nf_result'), unit:val('nf_unit'), refRange:val('nf_refRange'), flag:val('nf_flag') });
      addingType = null; await persist(); renderPanel();
    }
    async function submitVital(){
      const p = currentPatient();
      p.vitals.unshift({ id:uid('vi'), date:val('nf_date'), bp:val('nf_bp'), hr:val('nf_hr'), temp:val('nf_temp'), rr:val('nf_rr'), spo2:val('nf_spo2'), weight:val('nf_weight'), height:val('nf_height') });
      addingType = null; await persist(); renderPanel();
    }

    async function removeEntry(listKey, entryId){
      const p = currentPatient();
      p[listKey] = p[listKey].filter(e => e.id !== entryId);
      await persist();
      if(listKey === 'allergies') renderPatientHeaderAndPanel(); else renderPanel();
    }

    function flagHtml(flag){
      if(!flag || flag === 'Normal') return '<span style="color:#5B7F76;">Normal</span>';
      const color = (flag === 'High' || flag === 'Critical') ? 'var(--alert)' : 'var(--warn)';
      return `<span style="color:${color};font-weight:600;">${esc(flag)}</span>`;
    }
    function severityBadge(sev){
      const cls = sev === 'Severe' ? 'badge-severe' : sev === 'Moderate' ? 'badge-moderate' : 'badge-mild';
      return `<span class="badge ${cls}">${esc(sev)}</span>`;
    }

    function sectionHead(iconSvg, title, addLabel, addType){
      return `
        <div class="section-head">
          <div class="section-title">${iconSvg} ${esc(title)}</div>
          ${addType ? `<button class="btn btn-secondary" onclick="toggleAdd('${addType}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            ${esc(addLabel)}</button>` : ''}
        </div>`;
    }

    const ICONS = {
      overview: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>',
      visits: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>',
      medications: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><rect x="3" y="11" width="18" height="7" rx="3.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
      allergies: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>',
      labs: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M9 3h6M10 3v6l-5.5 9.5A1 1 0 0 0 5.4 20h13.2a1 1 0 0 0 .9-1.5L14 9V3"/></svg>',
      vitals: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>'
    };
    const TRASH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C7C1B2" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>';

    function renderPanel(){
      const p = currentPatient();
      const el = document.getElementById('tabPanel');
      if(!el) return;
      let html = '';

      if(activeTab === 'overview'){
        const activeMeds = p.medications.filter(m => m.status === 'Active').length;
        const lastVisit = p.visits[0] ? formatDate(p.visits[0].date) : '—';
        html += `<div class="stat-grid">
          <div class="stat-card"><div class="stat-value serif">${activeMeds}</div><div class="stat-label">Active medications</div></div>
          <div class="stat-card"><div class="stat-value serif">${p.allergies.length}</div><div class="stat-label">Known allergies</div></div>
          <div class="stat-card"><div class="stat-value serif">${p.visits.length}</div><div class="stat-label">Total visits</div></div>
          <div class="stat-card"><div class="stat-value serif" style="font-size:16px;">${esc(lastVisit)}</div><div class="stat-label">Last visit</div></div>
        </div>`;
        html += sectionHead(ICONS.overview, 'Active problems', null, null);
        html += p.problems.length === 0 ? '<div class="empty">No active problems documented.</div>' :
          p.problems.map(pr => `<div class="problem-item row"><span class="dot"></span>${esc(pr)}</div>`).join('');
      }

      else if(activeTab === 'visits'){
        html += sectionHead(ICONS.visits, 'Visit history', 'Log visit', 'visit');
        if(addingType === 'visit'){
          html += inlineFormHtml([
            {key:'date', label:'Date', type:'date', default:new Date().toISOString().slice(0,10)},
            {key:'type', label:'Visit type', type:'select', options:['Follow-up','Sick visit','Annual physical','New patient','Urgent care','Telehealth']},
            {key:'provider', label:'Provider'},
            {key:'reason', label:'Reason for visit'},
            {key:'notes', label:'Notes', type:'textarea'}
          ], 'Save visit', 'submitVisit');
        }
        html += p.visits.length === 0 ? '<div class="empty">No visits recorded yet.</div>' :
          p.visits.map(v => `
            <div class="row" style="padding:12px 0;">
              <div class="visit-item">
                <div class="visit-title">${esc(v.type)} — ${esc(v.reason)}</div>
                <button class="icon-btn" onclick="removeEntry('visits','${v.id}')">${TRASH}</button>
              </div>
              <div class="visit-meta">${formatDate(v.date)} · ${esc(v.provider)}</div>
              <div class="visit-notes">${esc(v.notes)}</div>
            </div>`).join('');
      }

      else if(activeTab === 'medications'){
        html += sectionHead(ICONS.medications, 'Medications', 'Add medication', 'med');
        if(addingType === 'med'){
          html += inlineFormHtml([
            {key:'name', label:'Medication name'},
            {key:'dosage', label:'Dosage', placeholder:'e.g. 10mg'},
            {key:'frequency', label:'Frequency', placeholder:'e.g. Once daily'},
            {key:'started', label:'Start date', type:'date', default:new Date().toISOString().slice(0,10)},
            {key:'status', label:'Status', type:'select', options:['Active','Discontinued']}
          ], 'Save medication', 'submitMed');
        }
        html += p.medications.length === 0 ? '<div class="empty">No medications on file.</div>' :
          p.medications.map(m => `
            <div class="row med-item" style="padding:12px 0;">
              <div>
                <div style="font-size:14px;font-weight:500;">${esc(m.name)} <span style="color:var(--muted);font-weight:400;">· ${esc(m.dosage)}</span></div>
                <div style="font-size:12.5px;color:var(--muted);">${esc(m.frequency)} · started ${formatDate(m.started)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge ${m.status==='Active'?'badge-active':'badge-inactive'}">${esc(m.status)}</span>
                <button class="icon-btn" onclick="removeEntry('medications','${m.id}')">${TRASH}</button>
              </div>
            </div>`).join('');
      }

      else if(activeTab === 'allergies'){
        html += sectionHead(ICONS.allergies, 'Allergies', 'Add allergy', 'allergy');
        if(addingType === 'allergy'){
          html += inlineFormHtml([
            {key:'substance', label:'Substance'},
            {key:'severity', label:'Severity', type:'select', options:['Mild','Moderate','Severe']},
            {key:'reaction', label:'Reaction'}
          ], 'Save allergy', 'submitAllergy');
        }
        html += p.allergies.length === 0 ? '<div class="empty">No known allergies.</div>' :
          p.allergies.map(a => `
            <div class="row allergy-item" style="padding:12px 0;">
              <div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:14px;font-weight:500;">${esc(a.substance)}</span>
                  ${severityBadge(a.severity)}
                </div>
                <div style="font-size:12.5px;color:var(--muted);">${esc(a.reaction)}</div>
              </div>
              <button class="icon-btn" onclick="removeEntry('allergies','${a.id}')">${TRASH}</button>
            </div>`).join('');
      }

      else if(activeTab === 'labs'){
        html += sectionHead(ICONS.labs, 'Lab results', 'Add result', 'lab');
        if(addingType === 'lab'){
          html += inlineFormHtml([
            {key:'date', label:'Date', type:'date', default:new Date().toISOString().slice(0,10)},
            {key:'test', label:'Test name'},
            {key:'result', label:'Result'},
            {key:'unit', label:'Unit'},
            {key:'refRange', label:'Reference range'},
            {key:'flag', label:'Flag', type:'select', options:['Normal','High','Low','Critical']}
          ], 'Save result', 'submitLab');
        }
        if(p.labs.length === 0){ html += '<div class="empty">No lab results on file.</div>'; }
        else {
          html += `<table class="mono"><thead><tr><th>Date</th><th>Test</th><th>Result</th><th>Reference</th><th>Flag</th><th></th></tr></thead><tbody>`;
          html += p.labs.map(l => `
            <tr class="row">
              <td>${formatDate(l.date)}</td>
              <td style="font-family:'IBM Plex Sans',sans-serif;">${esc(l.test)}</td>
              <td>${esc(l.result)} ${l.unit!=='—'?esc(l.unit):''}</td>
              <td style="color:var(--faint);">${esc(l.refRange)}</td>
              <td>${flagHtml(l.flag)}</td>
              <td><button class="icon-btn" onclick="removeEntry('labs','${l.id}')">${TRASH}</button></td>
            </tr>`).join('');
          html += `</tbody></table>`;
        }
      }

      else if(activeTab === 'vitals'){
        html += sectionHead(ICONS.vitals, 'Vitals', 'Record vitals', 'vital');
        if(addingType === 'vital'){
          html += inlineFormHtml([
            {key:'date', label:'Date', type:'date', default:new Date().toISOString().slice(0,10)},
            {key:'bp', label:'Blood pressure', placeholder:'120/80'},
            {key:'hr', label:'Heart rate (bpm)'},
            {key:'temp', label:'Temp (°F)'},
            {key:'rr', label:'Resp. rate'},
            {key:'spo2', label:'SpO2 (%)'},
            {key:'weight', label:'Weight (lb)'},
            {key:'height', label:'Height (in)'}
          ], 'Save vitals', 'submitVital');
        }
        if(p.vitals.length === 0){ html += '<div class="empty">No vitals recorded.</div>'; }
        else {
          html += `<table class="mono"><thead><tr><th>Date</th><th>BP</th><th>HR</th><th>Temp</th><th>RR</th><th>SpO2</th><th>Wt</th><th>Ht</th><th></th></tr></thead><tbody>`;
          html += p.vitals.map(v => `
            <tr class="row">
              <td>${formatDate(v.date)}</td><td>${esc(v.bp)}</td><td>${esc(v.hr)}</td><td>${esc(v.temp)}°</td>
              <td>${esc(v.rr)}</td><td>${esc(v.spo2)}%</td><td>${esc(v.weight)}</td><td>${esc(v.height)}</td>
              <td><button class="icon-btn" onclick="removeEntry('vitals','${v.id}')">${TRASH}</button></td>
            </tr>`).join('');
          html += `</tbody></table>`;
        }
      }

      el.innerHTML = html;
    }

    function setTab(key){ activeTab = key; addingType = null; renderPanel(); renderTabsBar(); }

    function renderTabsBar(){
      const el = document.getElementById('tabsBar');
      if(!el) return;
      el.innerHTML = TABS.map(t => `<div class="tab ${t.key===activeTab?'active':''}" onclick="setTab('${t.key}')">${esc(t.label)}</div>`).join('');
    }

    function renderPatientHeaderAndPanel(){
      const p = currentPatient();
      const el = document.getElementById('content');
      if(!p){
        el.innerHTML = '<div class="empty">Patient not found. <a href="patient-list.html" style="color:var(--accent);">Return to patient list</a>.</div>';
        return;
      }
      el.innerHTML = `
        <div class="patient-header">
          <h1 class="serif">${esc(p.name)}</h1>
          <div class="meta-line">
            <span>DOB ${formatDate(p.dob)} (${ageOf(p.dob)} yr)</span>
            <span>${esc(p.sex)}</span>
            <span class="mono">MRN ${esc(p.mrn)}</span>
            <span>${esc(p.bloodType)}</span>
            <span>${esc(p.phone)}</span>
          </div>
        </div>
        <div class="banner ${p.allergies.length ? 'banner-alert' : 'banner-ok'}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${p.allergies.length?'#A23B2E':'#5B7F76'}" stroke-width="2" style="margin-top:2px;flex-shrink:0;"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
          <div>${p.allergies.length === 0 ? '<span style="color:#5B7F76;">No known allergies on file.</span>' :
            '<strong style="color:#A23B2E;">Allergies: </strong>' + p.allergies.map(a => `${esc(a.substance)} (${esc(a.severity.toLowerCase())} — ${esc(a.reaction)})`).join(', ')}</div>
        </div>
        <div class="tabs" id="tabsBar"></div>
        <div class="tab-panel" id="tabPanel"></div>
      `;
      renderTabsBar();
      renderPanel();
    }

    (async function init(){
      patientId = qs('id');
      patients = await loadPatients();
      renderPatientHeaderAndPanel();
    })();
  </script>
</body>
</html>
